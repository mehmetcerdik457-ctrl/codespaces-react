name: OpenSSF Scorecard

on:
  pull_request:
    paths:
      - '.github/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  scorecard:
    uses: mehmetcerdik457-ctrl/.github/.github/workflows/reusable-scorecard.yml@0d6d7842289c0f3cf5456650358ce4885239207b
